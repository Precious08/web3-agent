name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm -r typecheck || echo "typecheck: no workspaces with script yet"
      - run: pnpm -r lint || echo "lint: no workspaces with script yet"
      - run: pnpm -r test || echo "test: no workspaces with script yet"
